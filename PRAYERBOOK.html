<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orthodox Christian Prayer Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #f4efe6;
      --card-bg: #ffffff;
      --text-main: #2b2625;
      --text-muted: #6b635b;
      --accent-burgundy: #7a1c1c;
      --accent-burgundy-hover: #5c1313;
      --gold-primary: #c59b27;
      --gold-light: #e5c158;
      --border-color: #e2d9cc;
      --shadow-sm: 0 2px 8px rgba(43, 38, 37, 0.05);
      --shadow-md: 0 6px 18px rgba(43, 38, 37, 0.08);
      --shadow-lg: 0 12px 28px rgba(43, 38, 37, 0.12);
      
      --font-heading: 'Cinzel', serif;
      --font-body: 'Cormorant Garamond', Georgia, serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    header {
      border-bottom: 3px solid var(--gold-primary);
      position: relative;
      overflow: hidden;
    }

    .banner-container {
      width: 100%;
      height: 280px;
      position: relative;
      background-color: #1a1a1a;
      overflow: hidden;
    }

    .banner-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      filter: blur(6px);
      transform: scale(1.05);
    }

    .header-text-block {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #ffffff;
      padding: 2rem 2rem;
      background: rgba(18, 14, 13, 0.65);
      border-radius: 10px;
      border: 1px solid var(--gold-primary);
      box-shadow: var(--shadow-lg), inset 0 0 15px rgba(197, 155, 39, 0.15);
      backdrop-filter: blur(4px);
      width: 85%;
      max-width: 600px;
      box-sizing: border-box;
    }

    .header-text-block::before {
      content: "☦";
      display: block;
      font-size: 1.6rem;
      color: var(--gold-primary);
      margin-bottom: 0.2rem;
      line-height: 1;
    }

    header h1 {
      margin: 0;
      font-family: var(--font-heading);
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fcfaf7;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
      text-transform: uppercase;
    }

    header p {
      margin: 0.5rem 0 0;
      font-size: 1.1rem;
      font-style: italic;
      color: var(--gold-light);
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
    }

    .container {
      max-width: 920px;
      margin: 2.5rem auto 4rem;
      padding: 0 1.5rem;
    }

    .search-container {
      position: relative;
      margin-bottom: 1.8rem;
    }

    .search-box {
      width: 100%;
      padding: 0.9rem 1.2rem;
      padding-left: 2.8rem;
      font-size: 1.1rem;
      font-family: var(--font-body);
      color: var(--text-main);
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: var(--shadow-sm);
      transition: all 0.25s ease;
    }

    .search-box:focus {
      outline: none;
      border-color: var(--gold-primary);
      box-shadow: 0 0 0 3px rgba(197, 155, 39, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1.1rem;
      pointer-events: none;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .breadcrumb {
      font-family: var(--font-heading);
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .breadcrumb span {
      cursor: pointer;
      color: var(--accent-burgundy);
      font-weight: 700;
      transition: color 0.2s;
    }

    .breadcrumb span:hover {
      color: var(--gold-primary);
      text-decoration: underline;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--accent-burgundy);
      color: #ffffff;
      border: none;
      padding: 0.5rem 1.1rem;
      border-radius: 6px;
      font-family: var(--font-heading);
      font-size: 0.8rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.15s;
      box-shadow: var(--shadow-sm);
    }

    .back-btn:hover {
      background-color: var(--accent-burgundy-hover);
      transform: translateY(-1px);
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.5rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s cubic-bezier(0.165, 0.84, 0.44, 1);
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--gold-primary);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: rgba(197, 155, 39, 0.5);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card h3 {
      margin: 0 0 0.8rem 0;
      font-family: var(--font-heading);
      font-size: 1.15rem;
      color: var(--accent-burgundy);
      line-height: 1.3;
    }

    .card p {
      margin: 0;
      display: flex;
      justify-content: flex-end;
    }

    .card .action-link {
      font-family: var(--font-heading);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--gold-primary);
      text-transform: uppercase;
    }

    .prayer-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2.5rem 3rem;
      box-shadow: var(--shadow-md);
      display: none;
      position: relative;
    }

    .prayer-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 1rem;
      margin-bottom: 2rem;
      gap: 1rem;
    }

    .prayer-title {
      font-family: var(--font-heading);
      font-size: 1.8rem;
      color: var(--accent-burgundy);
      margin: 0;
    }

    .prayer-toolbar {
      display: flex;
      gap: 0.5rem;
    }

    .tool-btn {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.4rem 0.7rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .tool-btn:hover {
      border-color: var(--gold-primary);
      color: var(--accent-burgundy);
    }

    .prayer-text {
      white-space: pre-line;
      font-size: 1.25rem;
      line-height: 1.8;
      color: var(--text-main);
    }

    .ornament {
      text-align: center;
      color: var(--gold-primary);
      font-size: 1.2rem;
      margin: 2rem 0 0;
      user-select: none;
    }

    @media (max-width: 600px) {
      .container {
        padding: 0 1rem;
      }

      .prayer-content {
        padding: 1.5rem;
      }

      .prayer-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .banner-container {
        height: 200px;
      }

      header h1 {
        font-size: 1.6rem;
      }

      header p {
        font-size: 0.95rem;
      }

      .card-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="banner-container">
      <img src="banner.jpg" alt="Orthodox Christian Icons Banner" class="banner-image">
      <div class="header-text-block">
        <h1>Orthodox Prayer Book</h1>
        <p>A Treasury of Orthodox Christian Prayers</p>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-box" placeholder="Search prayers by title or text..." oninput="handleSearch()">
    </div>

    <div class="nav-bar">
      <div class="breadcrumb" id="breadcrumb"></div>
      <button class="back-btn" id="backBtn" onclick="navigateBack()" style="display:none;">← Back</button>
    </div>

    <div id="navigationGrid" class="card-grid"></div>

    <div id="prayerView" class="prayer-content">
      <div class="prayer-header">
        <h2 id="prayerTitle" class="prayer-title"></h2>
        <div class="prayer-toolbar">
          <button class="tool-btn" onclick="adjustFontSize(1)" title="Increase text size">A+</button>
          <button class="tool-btn" onclick="adjustFontSize(-1)" title="Decrease text size">A-</button>
          <button class="tool-btn" onclick="copyPrayer()" title="Copy prayer text">📋 Copy</button>
        </div>
      </div>
      <div id="prayerText" class="prayer-text"></div>
      <div class="ornament">☦ ☦ ☦</div>
    </div>
  </div>

  <script>
    const prayerData = {
      "Daily Prayers": {
        "Morning Prayers": {
          "The Trisagion Prayers": `In the Name of the Father, and of the Son, and of the Holy Spirit. Amen.

Glory to Thee, our God, glory to Thee.

O Heavenly King, Comforter, Spirit of Truth, Who art everywhere present and fillest all things, Treasury of good things and Giver of life: come and dwell in us, and cleanse us from every stain, and save our souls, O Good One.

Holy God, Holy Mighty, Holy Immortal, have mercy on us. (3 times)

Glory to the Father, and to the Son, and to the Holy Spirit, both now and ever, and unto the ages of ages. Amen.`,

          "Prayer to the Most Holy Trinity": `Having risen from sleep, I thank Thee, O Holy Trinity, for through Thy great goodness and patience Thou hast not been angry with me, an idle and sinful person, nor hast Thou destroyed me in my iniquities, but hast shown Thy usual love for mankind; and when I was prostrated in despair, Thou hast raised me up to keep the morning watch and glorify Thy power.

And now enlighten my mind's eye and open my mouth to study Thy words, and understand Thy commandments, and do Thy will, and sing to Thee in heartfelt confession, and hymn Thy most holy Name: of the Father, and of the Son, and of the Holy Spirit, now and ever, and unto ages of ages. Amen.`,

          "The Nicene Creed": `I believe in one God, the Father Almighty, Maker of heaven and earth, and of all things visible and invisible.

And in one Lord Jesus Christ, the Son of God, the Only-begotten, begotten of the Father before all ages; Light of Light, true God of true God; begotten, not made; of one essence with the Father, by Whom all things were made; Who for us men and for our salvation came down from heaven, and was incarnate of the Holy Spirit and the Virgin Mary, and became man; and was crucified also for us under Pontius Pilate, and suffered and was buried; and the third day He rose again, according to the Scriptures; and ascended into heaven, and sitteth at the right hand of the Father; and He shall come again with glory to judge the living and the dead; Whose kingdom shall have no end.

And in the Holy Spirit, the Lord, the Giver of Life, Who proceeds from the Father; Who with the Father and the Son together is worshipped and glorified; Who spoke by the prophets.

In one, holy, catholic, and apostolic Church. I acknowledge one baptism for the remission of sins. I look for the resurrection of the dead, and the life of the world to come. Amen.`,

          "Morning Prayer of St. Philaret": `O Lord, grant me to greet the coming day in peace. Help me in all things to rely upon Thy holy will.

In every hour of the day reveal Thy will to me. Bless my dealings with all who surround me. Teach me to treat all that comes to me throughout the day with peace of soul and with firm conviction that Thy will governs all.

In all my deeds and words, guide my thoughts and feelings. In unforseen events, let me not forget that all are sent by Thee. Teach me to act firmly and wisely, without embittering and embarrassing others.

Give me strength to bear the fatigue of the coming day with all that it shall bring. Direct my will, teach me to pray, pray Thou Thyself in me. Amen.`,

          "Prayer to the Guardian Angel": `O holy Angel, who standest before my wretched soul and passionate life, do not abandon me, a sinner, nor depart from me because of my intemperance. Give no place to the evil demon to overpower me through the oppression of this mortal body. Strengthen my weak and feeble hand, and guide me in the way of salvation.

Yea, O holy Angel of God, guardian and protector of my wretched soul and body, forgive me all things wherewith I have grieved thee all the days of my life; and if I have sinned during the past night, protect me during the present day, and guard me from every temptation of the enemy, that I may not anger God by any sin. And pray to the Lord for me, that He may establish me in His fear, and show me to be a worthy servant of His goodness. Amen.`
        },
        "Evening Prayers": {
          "Prayer to the Holy Spirit": `O Lord, Heavenly King, Comforter, the Spirit of Truth, show compassion and have mercy on me, Thy sinful servant, and forgive me, unworthy though I am.

Forgive all the sins I have committed today as a human being, and not only as a human being, but worse than a beast—my voluntary and involuntary sins, known and unknown, resulting from youth and evil suggestions, or from habit and apathy.

If I have sworn by Thy Name, or blasphemed it in my thought, or reproached anyone, or angered anyone, or lusted after something, forgive me, O Lord. Amen.`,

          "Prayer of St. Macarius": `O Eternal God and King of all creation, Who hast vouchsafed me to arrive at this hour, forgive me the sins which I have committed this day in deed, word, and thought.

Cleanse, O Lord, my humble soul from all defilement of flesh and spirit. Grant me, O Lord, to pass through the sleep of this night in peace, that when I rise from my bed I may please Thy holy Name all the days of my life. Amen.`,

          "Prayer of St. Antiochus": `O Ruler of all, Word of the Father, Thou Who art Thyself perfect, Jesus Christ, for the sake of Thy great mercy never depart from me, Thy servant, but abide in me always. O Jesus, Good Shepherd of Thy sheep, deliver me not to the revolt of the serpent, and leave me not to the will of Satan, for the seed of corruption is in me.

Do Thou, O Lord God worshipped in holiness, Holy King Jesus Christ, preserve me while I sleep by the unextinguishable Light, Thy Holy Spirit, by Whom Thou didst sanctify Thy disciples. Grant also, O Lord, to me, Thy unworthy servant, Thy salvation upon my bed. Enlighten my mind with the light of the understanding of Thy holy Gospel. Amen.`,

          "Prayer to the Mother of God": `O Good Mother of the Good King, most pure and blessed Theotokos Mary, pour out the mercy of thy Son and our God upon my passionate soul, and by thy prayers guide me to good works, that I may pass the remaining time of my life without stain, and through thee attain Paradise, O Virgin Theotokos, who alone art pure and blessed. Amen.`,

          "Prayer of the Holy Cross": `Let God arise, and let His enemies be scattered; let those also who hate Him flee before Him. As smoke vanishes, so let them vanish; as wax melts before the fire, so let the demons perish from the presence of those who love God and who sign themselves with the Sign of the Cross and say in gladness:

Rejoice, most precious and life-giving Cross of the Lord, which drivest away demons by the power of our Lord Jesus Christ Who was crucified on thee, Who went down into hell and trampled down the power of the devil, and gave us His precious Cross to drive away every enemy.

O most precious and life-giving Cross of the Lord, help me together with the Holy Lady Virgin Theotokos and with all the saints forever. Amen.`
        }
      },
      "Mealtime Prayers": {
        "Before Meals": {
          "Lord's Prayer & Blessing": `Our Father, Who art in heaven, hallowed be Thy name. Thy kingdom come, Thy will be done, on earth as it is in heaven. Give us this day our daily bread, and forgive us our trespasses, as we forgive those who trespass against us. And lead us not into temptation, but deliver us from evil.

Glory to the Father, and to the Son, and to the Holy Spirit, both now and ever, and unto the ages of ages. Amen.

Lord, have mercy (3 times). Father, bless.

Christ our God, bless the food and drink of Thy servants, for Thou art holy, always, now and ever, and unto the ages of ages. Amen.`,

          "Blessing of Food for Fasting Days": `The poor shall eat and be satisfied, and those who seek the Lord shall praise Him; their hearts shall live forever.

Glory to the Father, and to the Son, and to the Holy Spirit, both now and ever, and unto ages of ages. Amen.

Lord, have mercy (3 times). Father, bless.

Christ our God, bless the fast-day food and drink of Thy servants, for Thou art holy, always, now and ever, and unto ages of ages. Amen.`
        },
        "After Meals": {
          "Thanksgiving After Meals": `We thank Thee, O Christ our God, for Thou hast satisfied us with Thy earthly gifts. Deprive us not also of Thy Heavenly Kingdom, but as Thou camest among Thy disciples, O Savior, giving them peace, come unto us and save us.

Glory to the Father, and to the Son, and to the Holy Spirit, both now and ever, and unto the ages of ages. Amen.

Lord, have mercy (3 times). Father, bless. Amen.`
        },
        "Preparation of Food": {
          "Prayer Before Cooking": `O Creator and Author of all things, God Who giveth spiritual grace and bestoweth eternal salvation: Do Thou, the same Lord, send down Thy Holy Spirit with a blessing from on high upon these provisions, that those who prepare and consume them may be filled with health, strength, and heavenly peace, through Jesus Christ our Lord. Amen.`
        }
      },
      "Occasional Prayers": {
        "Short Daily Prayers": {
          "The Jesus Prayer": `Lord Jesus Christ, Son of God, have mercy on me, a sinner.`,

          "Prayer of St. Ephrem the Syrian": `O Lord and Master of my life, take from me the spirit of sloth, despair, lust of power, and idle talk. (Prostration)

But give rather the spirit of chastity, humility, patience, and love to Thy servant. (Prostration)

Yea, O Lord and King, grant me to see my own transgressions, and not to judge my brother, for blessed art Thou unto ages of ages. Amen. (Prostration)`
        },
        "Prayers for Loved Ones": {
          "Prayer for One's Spiritual Father": `O Lord Jesus Christ our God, look down with Thy merciful eye upon Thy servant, my Spiritual Father (Name), and deliver him from every temptation, sorrow, and distress. Grant him health of soul and length of days, and guide my unworthy self through his holy prayers unto eternal life. Amen.`,

          "Prayer for a Sick Person": `O Lord Almighty, the Healer of our souls and bodies, Who abasest and liftest up, Who chastinest and healest also: visit Thy servant who is sick with Thy mercy.

Stretch forth Thine arm which is full of healing and health, and raise him/her up from his/her bed, and cure his/her illness. Rebuke the spirit of weakness, drive away from him/her all pain, all sores, all fever and ague.

If he/she has sins or transgressions, grant remission and forgiveness, for Thou art the Lover of mankind. Amen.`,

          "Prayer for the Departed": `Give rest, O Lord, to the soul of Thy departed servant (Name), in a place of light, a place of green pasture, a place of repose, where all sickness, sorrow, and sighing have fled away. 

Forgive every sin committed by him/her in word, deed, or thought, in Thy goodness and love for mankind, for there is no man who lives and does not sin. Thou alone art without sin, Thy righteousness is an everlasting righteousness, and Thy word is truth. Amen.`
        },
        "Prayers Before Work & Travel": {
          "Prayer Before Reading Scripture": `Illumine our hearts, O Master Who lovest mankind, with the pure light of Thy divine knowledge. Open the eyes of our mind to the understanding of Thy Gospel teachings. 

Instill in us also the fear of Thy blessed commandments, that trampling down all carnal desires, we may enter upon a spiritual manner of living, both thinking and doing such things as are well-pleasing unto Thee. For Thou art the illumination of our souls and bodies, O Christ our God, and unto Thee we ascribe glory, together with Thy Father Who is from everlasting, and Thy all-holy, good, and life-creating Spirit, now and ever, and unto ages of ages. Amen.`,

          "Prayer for Travellers": `O Lord Jesus Christ our God, the true and living Way, Who didst deem it worthy to travel with Thy supposed father Joseph and Thy most pure Mother to Egypt, and Who didst travel with Luke and Cleopas to Emmaus:

We now humbly beseech Thee, O Most Holy Master, do Thou travel also with Thy servant(s). Deliver us from every storm and danger, preserve us in safety, and grant us a peaceful journey and a safe return. Amen.`
        }
      }
    };

    let path = [];
    let currentFontSize = 1.25;

    function render() {
      const grid = document.getElementById("navigationGrid");
      const prayerView = document.getElementById("prayerView");
      const breadcrumb = document.getElementById("breadcrumb");
      const backBtn = document.getElementById("backBtn");
      const searchInput = document.getElementById("searchInput");

      grid.style.display = "grid";
      prayerView.style.display = "none";
      grid.innerHTML = "";

      let breadcrumbHtml = `<span onclick="navigateTo([])">Home</span>`;
      let currentObj = prayerData;

      for (let i = 0; i < path.length; i++) {
        const step = path[i];
        currentObj = currentObj[step];
        breadcrumbHtml += ` &nbsp;›&nbsp; <span onclick="navigateTo([${path.slice(0, i + 1).map(s => `'${s}'`).join(',')}])">${step}</span>`;
      }
      breadcrumb.innerHTML = breadcrumbHtml;
      backBtn.style.display = path.length > 0 ? "inline-flex" : "none";

      if (typeof currentObj === "string") {
        grid.style.display = "none";
        prayerView.style.display = "block";
        document.getElementById("prayerTitle").innerText = path[path.length - 1];
        document.getElementById("prayerText").innerText = currentObj;
        return;
      }

      Object.keys(currentObj).forEach(key => {
        const card = document.createElement("div");
        card.className = "card";
        const isPrayer = typeof currentObj[key] === "string";
        card.innerHTML = `
          <h3>${key}</h3>
          <p><span class="action-link">${isPrayer ? "Read →" : "Explore →"}</span></p>
        `;
        card.onclick = () => {
          searchInput.value = "";
          path.push(key);
          render();
        };
        grid.appendChild(card);
      });
    }

    function navigateTo(newPath) {
      path = newPath;
      document.getElementById("searchInput").value = "";
      render();
    }

    function navigateBack() {
      path.pop();
      document.getElementById("searchInput").value = "";
      render();
    }

    function handleSearch() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      if (!query) {
        render();
        return;
      }

      path = [];
      document.getElementById("breadcrumb").innerHTML = "SEARCH RESULTS";
      document.getElementById("backBtn").style.display = "none";
      
      const grid = document.getElementById("navigationGrid");
      const prayerView = document.getElementById("prayerView");
      grid.style.display = "grid";
      prayerView.style.display = "none";
      grid.innerHTML = "";

      function searchRecursive(obj, currentPath) {
        Object.keys(obj).forEach(key => {
          const nextPath = [...currentPath, key];
          if (typeof obj[key] === "string") {
            if (key.toLowerCase().includes(query) || obj[key].toLowerCase().includes(query)) {
              const card = document.createElement("div");
              card.className = "card";
              card.innerHTML = `
                <h3>${key}</h3>
                <p><span class="action-link">Read →</span></p>
              `;
              card.onclick = () => {
                path = nextPath;
                render();
              };
              grid.appendChild(card);
            }
          } else {
            searchRecursive(obj[key], nextPath);
          }
        });
      }

      searchRecursive(prayerData, []);
      if (grid.children.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;">No prayers found matching "${query}".</p>`;
      }
    }

    function adjustFontSize(delta) {
      currentFontSize = Math.max(1.0, Math.min(1.8, currentFontSize + (delta * 0.1)));
      document.getElementById("prayerText").style.fontSize = `${currentFontSize}rem`;
    }

    function copyPrayer() {
      const title = document.getElementById("prayerTitle").innerText;
      const text = document.getElementById("prayerText").innerText;
      navigator.clipboard.writeText(`${title}\n\n${text}`).then(() => {
        alert("Prayer text copied to clipboard!");
      });
    }

    render();
  </script>
</body>
</html>
