<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orthodox Christian Prayer Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #f4efe6;
      --card-bg: #ffffff;
      --text-main: #2b2625;
      --text-muted: #6b635b;
      --accent-burgundy: #7a1c1c;
      --accent-burgundy-hover: #5c1313;
      --gold-primary: #c59b27;
      --gold-light: #e5c158;
      --border-color: #e2d9cc;
      --shadow-sm: 0 2px 8px rgba(43, 38, 37, 0.05);
      --shadow-md: 0 6px 18px rgba(43, 38, 37, 0.08);
      --shadow-lg: 0 12px 28px rgba(43, 38, 37, 0.12);
      
      --font-heading: 'Cinzel', serif;
      --font-body: 'Cormorant Garamond', Georgia, serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    header {
      border-bottom: 3px solid var(--gold-primary);
      position: relative;
      overflow: hidden;
    }

    .banner-container {
      width: 100%;
      height: 280px;
      position: relative;
      background-color: #1a1a1a;
      overflow: hidden;
    }

    .banner-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      filter: blur(6px);
      transform: scale(1.05);
    }

    .header-text-block {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #ffffff;
      padding: 2rem;
      background: rgba(18, 14, 13, 0.65);
      border-radius: 10px;
      border: 1px solid var(--gold-primary);
      box-shadow: var(--shadow-lg), inset 0 0 15px rgba(197, 155, 39, 0.15);
      backdrop-filter: blur(4px);
      width: 85%;
      max-width: 600px;
    }

    .header-text-block::before {
      content: "☦";
      display: block;
      font-size: 1.6rem;
      color: var(--gold-primary);
      margin-bottom: 0.2rem;
      line-height: 1;
    }

    header h1 {
      margin: 0;
      font-family: var(--font-heading);
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #fcfaf7;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
      text-transform: uppercase;
    }

    header p {
      margin: 0.5rem 0 0;
      font-size: 1.1rem;
      font-style: italic;
      color: var(--gold-light);
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
    }

    .container {
      max-width: 920px;
      margin: 2.5rem auto 4rem;
      padding: 0 1.5rem;
    }

    .search-container {
      position: relative;
      margin-bottom: 1.8rem;
    }

    .search-box {
      width: 100%;
      padding: 0.9rem 1.2rem;
      padding-left: 2.8rem;
      font-size: 1.1rem;
      font-family: var(--font-body);
      color: var(--text-main);
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: var(--shadow-sm);
      transition: all 0.25s ease;
    }

    .search-box:focus {
      outline: none;
      border-color: var(--gold-primary);
      box-shadow: 0 0 0 3px rgba(197, 155, 39, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1.1rem;
      pointer-events: none;
    }

    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .breadcrumb {
      font-family: var(--font-heading);
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .breadcrumb span {
      cursor: pointer;
      color: var(--accent-burgundy);
      font-weight: 700;
      transition: color 0.2s;
    }

    .breadcrumb span:hover {
      color: var(--gold-primary);
      text-decoration: underline;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--accent-burgundy);
      color: #ffffff;
      border: none;
      padding: 0.5rem 1.1rem;
      border-radius: 6px;
      font-family: var(--font-heading);
      font-size: 0.8rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.15s;
      box-shadow: var(--shadow-sm);
    }

    .back-btn:hover {
      background-color: var(--accent-burgundy-hover);
      transform: translateY(-1px);
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.5rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s cubic-bezier(0.165, 0.84, 0.44, 1);
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--gold-primary);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: rgba(197, 155, 39, 0.5);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card h3 {
      margin: 0 0 0.8rem 0;
      font-family: var(--font-heading);
      font-size: 1.15rem;
      color: var(--accent-burgundy);
      line-height: 1.3;
    }

    .card p {
      margin: 0;
      display: flex;
      justify-content: flex-end;
    }

    .card .action-link {
      font-family: var(--font-heading);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--gold-primary);
      text-transform: uppercase;
    }

    .prayer-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2.5rem 3rem;
      box-shadow: var(--shadow-md);
      display: none;
      position: relative;
    }

    .prayer-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 1rem;
      margin-bottom: 2rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .prayer-title {
      font-family: var(--font-heading);
      font-size: 1.8rem;
      color: var(--accent-burgundy);
      margin: 0;
    }

    .prayer-toolbar {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .tool-btn {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.4rem 0.7rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .tool-btn:hover {
      border-color: var(--gold-primary);
      color: var(--accent-burgundy);
    }

    .tool-btn.active {
      background: var(--accent-burgundy);
      color: #ffffff;
      border-color: var(--accent-burgundy);
    }

    .prayer-text {
      white-space: pre-line;
      font-size: 1.25rem;
      line-height: 1.8;
      color: var(--text-main);
    }

    .ornament {
      text-align: center;
      color: var(--gold-primary);
      font-size: 1.2rem;
      margin: 2rem 0 0;
      user-select: none;
    }

    @media (max-width: 600px) {
      .container { padding: 0 1rem; }
      .prayer-content { padding: 1.5rem; }
      .prayer-header { flex-direction: column; align-items: flex-start; }
      .banner-container { height: 200px; }
      header h1 { font-size: 1.6rem; }
      header p { font-size: 0.95rem; }
      .card-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="banner-container">
      <img src="banner.jpg" alt="Orthodox Christian Icons Banner" class="banner-image">
      <div class="header-text-block">
        <h1>Orthodox Prayer Book</h1>
        <p>A Treasury of Orthodox Christian Prayers</p>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-box" placeholder="Search prayers by title or text..." oninput="handleSearch()">
    </div>

    <div class="nav-bar">
      <div class="breadcrumb" id="breadcrumb"></div>
      <button class="back-btn" id="backBtn" onclick="navigateBack()" style="display:none;">← Back</button>
    </div>

    <div id="navigationGrid" class="card-grid"></div>

    <div id="prayerView" class="prayer-content">
      <div class="prayer-header">
        <h2 id="prayerTitle" class="prayer-title"></h2>
        <div class="prayer-toolbar">
          <button class="tool-btn" id="ttsBtn" onclick="toggleSpeech()" title="Read prayer aloud">🔊 Read Aloud</button>
          <button class="tool-btn" id="stopTtsBtn" onclick="stopSpeech()" title="Stop audio" style="display:none;">⏹ Stop</button>
          <button class="tool-btn" onclick="adjustFontSize(1)" title="Increase text size">A+</button>
          <button class="tool-btn" onclick="adjustFontSize(-1)" title="Decrease text size">A-</button>
          <button class="tool-btn" onclick="copyPrayer()" title="Copy prayer text">📋 Copy</button>
        </div>
      </div>
      <div id="prayerText" class="prayer-text"></div>
      <div class="ornament">☦ ☦ ☦</div>
    </div>
  </div>

  <script>
    // Structure: 10 Main Categories -> 10 Subcategories -> 10 Sub-Subcategories -> 10 Prayers each
    const mainCategories = [
      "1. Morning Rule",
      "2. Evening Rule",
      "3. Holy Communion",
      "4. Repentance & Confession",
      "5. Intercessions & Health",
      "6. Family & Household",
      "7. Daily Work & Labors",
      "8. Feasts & Fasting",
      "9. In Times of Trial",
      "10. Praise & Thanksgiving"
    ];

    const prayerData = {};

    // Generate 3-tier deep navigation tree
    mainCategories.forEach((catName, cIdx) => {
      prayerData[catName] = {};
      
      for (let sIdx = 1; sIdx <= 10; sIdx++) {
        const subCatName = `Subcategory ${cIdx + 1}.${sIdx}`;
        prayerData[catName][subCatName] = {};

        for (let ssIdx = 1; ssIdx <= 10; ssIdx++) {
          const subSubCatName = `Topic ${cIdx + 1}.${sIdx}.${ssIdx}`;
          prayerData[catName][subCatName][subSubCatName] = {};

          for (let pIdx = 1; pIdx <= 10; pIdx++) {
            const prayerTitle = `Prayer ${pIdx}: Devotion ${cIdx + 1}.${sIdx}.${ssIdx}.${pIdx}`;
            
            let textBody = `In the Name of the Father, and of the Son, and of the Holy Spirit. Amen.\n\n`;
            textBody += `O Lord Jesus Christ, Son of God, have mercy upon us, Thy servants. (3 times)\n\n`;
            textBody += `We offer this supplication under ${catName} → ${subCatName} → ${subSubCatName}.\n\n`;
            textBody += `Grant us wisdom, peace of heart, and steadfast faith as we offer our petitions unto Thee. Protect us from every evil, enlighten our minds, and direct our hearts in accordance with Thy holy will.\n\n`;
            textBody += `Through the prayers of our Holy Fathers, Lord Jesus Christ our God, have mercy on us and save us. Amen. (Prostration)`;

            prayerData[catName][subCatName][subSubCatName][prayerTitle] = textBody;
          }
        }
      }
    });

    let path = [];
    let currentFontSize = 1.25;
    let ttsUtterance = null;

    function render() {
      stopSpeech();
      const grid = document.getElementById("navigationGrid");
      const prayerView = document.getElementById("prayerView");
      const breadcrumb = document.getElementById("breadcrumb");
      const backBtn = document.getElementById("backBtn");
      const searchInput = document.getElementById("searchInput");

      grid.style.display = "grid";
      prayerView.style.display = "none";
      grid.innerHTML = "";

      let breadcrumbHtml = `<span onclick="navigateTo([])">Home</span>`;
      let currentObj = prayerData;

      for (let i = 0; i < path.length; i++) {
        const step = path[i];
        currentObj = currentObj[step];
        breadcrumbHtml += ` &nbsp;›&nbsp; <span onclick="navigateTo([${path.slice(0, i + 1).map(s => `'${s.replace(/'/g, "\\'")}'`).join(',')}])">${step}</span>`;
      }
      breadcrumb.innerHTML = breadcrumbHtml;
      backBtn.style.display = path.length > 0 ? "inline-flex" : "none";

      if (typeof currentObj === "string") {
        grid.style.display = "none";
        prayerView.style.display = "block";
        document.getElementById("prayerTitle").innerText = path[path.length - 1];
        document.getElementById("prayerText").innerText = currentObj;
        return;
      }

      Object.keys(currentObj).forEach(key => {
        const card = document.createElement("div");
        card.className = "card";
        const isPrayer = typeof currentObj[key] === "string";
        card.innerHTML = `
          <h3>${key}</h3>
          <p><span class="action-link">${isPrayer ? "Read →" : "Explore →"}</span></p>
        `;
        card.onclick = () => {
          searchInput.value = "";
          path.push(key);
          render();
        };
        grid.appendChild(card);
      });
    }

    function navigateTo(newPath) {
      path = newPath;
      document.getElementById("searchInput").value = "";
      render();
    }

    function navigateBack() {
      path.pop();
      document.getElementById("searchInput").value = "";
      render();
    }

    function handleSearch() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      if (!query) {
        render();
        return;
      }

      path = [];
      document.getElementById("breadcrumb").innerHTML = "SEARCH RESULTS";
      document.getElementById("backBtn").style.display = "none";
      
      const grid = document.getElementById("navigationGrid");
      const prayerView = document.getElementById("prayerView");
      grid.style.display = "grid";
      prayerView.style.display = "none";
      grid.innerHTML = "";

      function searchRecursive(obj, currentPath) {
        Object.keys(obj).forEach(key => {
          const nextPath = [...currentPath, key];
          if (typeof obj[key] === "string") {
            if (key.toLowerCase().includes(query) || obj[key].toLowerCase().includes(query)) {
              const card = document.createElement("div");
              card.className = "card";
              card.innerHTML = `
                <h3>${key}</h3>
                <p><span class="action-link">Read →</span></p>
              `;
              card.onclick = () => {
                path = nextPath;
                render();
              };
              grid.appendChild(card);
            }
          } else {
            searchRecursive(obj[key], nextPath);
          }
        });
      }

      searchRecursive(prayerData, []);
      if (grid.children.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;">No prayers found matching "${query}".</p>`;
      }
    }

    function adjustFontSize(delta) {
      currentFontSize = Math.max(1.0, Math.min(1.8, currentFontSize + (delta * 0.1)));
      document.getElementById("prayerText").style.fontSize = `${currentFontSize}rem`;
    }

    function copyPrayer() {
      const title = document.getElementById("prayerTitle").innerText;
      const text = document.getElementById("prayerText").innerText;
      navigator.clipboard.writeText(`${title}\n\n${text}`).then(() => {
        alert("Prayer text copied to clipboard!");
      });
    }

    /* --- Text to Speech (TTS) Engine --- */
    function toggleSpeech() {
      if (!('speechSynthesis' in window)) {
        alert("Text-to-Speech is not supported by your browser.");
        return;
      }

      const ttsBtn = document.getElementById("ttsBtn");
      const stopBtn = document.getElementById("stopTtsBtn");

      if (window.speechSynthesis.speaking) {
        if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
          ttsBtn.innerText = "⏸ Pause";
          ttsBtn.classList.add("active");
        } else {
          window.speechSynthesis.pause();
          ttsBtn.innerText = "▶ Resume";
          ttsBtn.classList.remove("active");
        }
      } else {
        const rawText = document.getElementById("prayerText").innerText;
        // Clean rubric instructions in parentheses for audio playback
        const cleanedText = rawText.replace(/\([^)]*\)/g, '');

        ttsUtterance = new SpeechSynthesisUtterance(cleanedText);
        ttsUtterance.rate = 0.9;
        ttsUtterance.pitch = 0.95;

        ttsUtterance.onend = () => resetSpeechUI();
        ttsUtterance.onerror = () => resetSpeechUI();

        window.speechSynthesis.speak(ttsUtterance);
        ttsBtn.innerText = "⏸ Pause";
        ttsBtn.classList.add("active");
        stopBtn.style.display = "inline-flex";
      }
    }

    function stopSpeech() {
      if ('speechSynthesis' in window && window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
      }
      resetSpeechUI();
    }

    function resetSpeechUI() {
      const ttsBtn = document.getElementById("ttsBtn");
      const stopBtn = document.getElementById("stopTtsBtn");
      if (ttsBtn) {
        ttsBtn.innerText = "🔊 Read Aloud";
        ttsBtn.classList.remove("active");
      }
      if (stopBtn) {
        stopBtn.style.display = "none";
      }
    }

    render();
  </script>
</body>
</html>
